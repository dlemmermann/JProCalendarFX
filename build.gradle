buildscript {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        mavenCentral()
        maven {
            url "https://sandec.jfrog.io/artifactory/repo"
        }
    }
    dependencies {
        classpath "one.jpro:jpro-gradle-plugin:$jproVersion"
    }
}

plugins {
    id 'java'
    id 'application'
    id 'maven-publish'
    id 'org.openjfx.javafxplugin' version "$javafxPluginVersion"
}

apply plugin: 'jpro-gradle-plugin'

group 'com.jpro'
version "$projectVersion"

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url "https://sandec.jfrog.io/artifactory/repo"
    }
}

dependencies {
    implementation "com.calendarfx:view:$calendarFxVersion"
}

javafx {
    version = "$javafxVersion"
    modules = ['javafx.base', 'javafx.graphics', 'javafx.controls', 'javafx.fxml', 'javafx.media', 'javafx.web']
}

application {
    mainClass = 'com.dlsc.jpro.calendar.CalendarJProMain'
}

jpro {
    port = 8080
    useGradleLogging = true
    openingPath = "/test/fullscreen/default"
}


publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId project.group
            artifactId project.name
            version project.version
        }
    }
    repositories {
        if (System.getenv("SANDEC_ARTIFACTORY_USERNAME") && System.getenv("SANDEC_ARTIFACTORY_PASSWORD")) {
            maven {
                name = "artifactory"
                url = "https://sandec.jfrog.io/artifactory/apps"
                credentials {
                    username = System.getenv("SANDEC_ARTIFACTORY_USERNAME")
                    password = System.getenv("SANDEC_ARTIFACTORY_PASSWORD")
                }
            }
        }
    }
}